baseURL = 'https://nomad-hpc.com/'
languageCode = 'en-us'
title = 'NØMAÐ-HPC'
disableKinds = ['taxonomy', 'term', 'RSS']

[params]
  name = "NØMAÐ"
  expansion = "NØde Monitoring And Ðiagnostics"
  tagline = "Open-source monitoring and diagnostics for HPC clusters"
  description = "NØMAÐ watches HPC clusters, interactive servers, lab workstations and storage, and turns what it sees into plain answers for researchers, PIs and research computing staff."
  version = "1.62.0"
  released = "November 2026"
  github = "https://github.com/jtonini/nomad-hpc"
  docs = "https://jtonini.github.io/nomad-hpc/"
  pypi = "https://pypi.org/project/nomad-hpc/"
  paper = "https://doi.org/10.5334/jors.686"
  zenodo = "https://doi.org/10.5281/zenodo.18614517"
  # An address for "Contact" in the footer; left empty, people are sent to
  # GitHub issues instead (an institutional address would name the institution).
  contact = ""
  # The Console's source, once its repository is public. Left empty, the
  # Get started section describes the Console without linking to it.
  console_repo = ""

[markup.goldmark.renderer]
  unsafe = true


<header class="site-header">
    <nav class="nav" aria-label="Main">
        <a href="/" class="nav-mark" aria-label="{{ .Site.Params.name }}, home">{{ partial "wordmark.html" (dict "class" "nav-wordmark" "compact" true) }}</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menu</button>
        <ul class="nav-links" id="nav-links">
            {{ range .Site.Menus.main }}
            <li><a href="{{ .URL }}"{{ if hasPrefix .URL "http" }} class="external" target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a></li>
            {{ end }}
        </ul>
    </nav>
</header>

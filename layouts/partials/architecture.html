{{- /* How the parts fit: sites collect, the hub syncs, the Console and the rest read the hub.
     Inline so it takes the page's fonts and colours. Hidden on narrow screens, where the
     numbered steps beside it say the same. */ -}}
<svg class="arch" viewBox="-34 0 1194 478" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How NØMAÐ's parts fit together</title>
  <desc id="arch-desc">Each site, a cluster, an interactive server, lab workstations or a storage server, runs nomad collect into its own database. The hub runs nomad sync to gather them into one combined database. The Console, emails, reports and Prometheus metrics read that database. The Console acts on a cluster as the person through nomad-gate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" class="arch-arrowhead"/>
    </marker>
  </defs>

  <text x="0" y="18" class="arch-col">Sites<tspan class="arch-cmd" dx="12">nomad collect</tspan></text>
  <text x="416" y="18" class="arch-col">Hub<tspan class="arch-cmd" dx="12">nomad sync</tspan></text>
  <text x="800" y="18" class="arch-col">What people see</text>

  <g class="arch-site">
    <rect x="0" y="40" width="300" height="78" rx="10"/>
    <text x="20" y="70" class="arch-name">HPC cluster</text>
    <text x="20" y="94" class="arch-note">Slurm, nodes, GPUs, temperatures</text>
  </g>
  <g class="arch-site">
    <rect x="0" y="134" width="300" height="78" rx="10"/>
    <text x="20" y="164" class="arch-name">Interactive server</text>
    <text x="20" y="188" class="arch-note">RStudio and Jupyter sessions</text>
  </g>
  <g class="arch-site">
    <rect x="0" y="228" width="300" height="78" rx="10"/>
    <text x="20" y="258" class="arch-name">Lab workstations</text>
    <text x="20" y="282" class="arch-note">read over ssh from one machine</text>
  </g>
  <g class="arch-site">
    <rect x="0" y="322" width="300" height="78" rx="10"/>
    <text x="20" y="352" class="arch-name">Storage servers</text>
    <text x="20" y="376" class="arch-note">who holds what, and where</text>
  </g>

  <g class="arch-flow">
    <path d="M300 79 C360 79 360 205 414 215" marker-end="url(#arrow)"/>
    <path d="M300 173 C360 173 360 212 414 220" marker-end="url(#arrow)"/>
    <path d="M300 267 C360 267 360 228 414 226" marker-end="url(#arrow)"/>
    <path d="M300 361 C360 361 360 235 414 231" marker-end="url(#arrow)"/>
  </g>

  <g class="arch-hub">
    <rect x="416" y="132" width="288" height="176" rx="12"/>
    <text x="438" y="166" class="arch-name">Gathers the sites</text>
    <text x="438" y="192" class="arch-note">copies each site's database safely,</text>
    <text x="438" y="212" class="arch-note">merges them, and notes which sites</text>
    <text x="438" y="232" class="arch-note">answered and which went quiet</text>
    <path d="M470 258 v26 a90 11 0 0 0 180 0 v-26" class="arch-db"/>
    <ellipse cx="560" cy="258" rx="90" ry="11" class="arch-db"/>
    <text x="560" y="281" class="arch-dbtext" text-anchor="middle">combined database</text>
  </g>

  <g class="arch-flow">
    <path d="M704 210 C750 210 750 79 798 79" marker-end="url(#arrow)"/>
    <path d="M704 218 C750 218 750 173 798 173" marker-end="url(#arrow)"/>
    <path d="M704 226 C750 226 750 267 798 267" marker-end="url(#arrow)"/>
  </g>

  <g class="arch-out arch-out-main">
    <rect x="800" y="40" width="320" height="78" rx="10"/>
    <text x="820" y="70" class="arch-name">Console</text>
    <text x="820" y="94" class="arch-note">each person sees what their role allows</text>
  </g>
  <g class="arch-out">
    <rect x="800" y="134" width="320" height="78" rx="10"/>
    <text x="820" y="164" class="arch-name">Email</text>
    <text x="820" y="188" class="arch-note">weekly notes, alerts, term reports</text>
  </g>
  <g class="arch-out">
    <rect x="800" y="228" width="320" height="78" rx="10"/>
    <text x="820" y="258" class="arch-name">Prometheus and Grafana</text>
    <text x="820" y="282" class="arch-note">nomad metrics serve</text>
  </g>

  <g class="arch-gate">
    <path d="M1120 79 H1146 V448 H-22 V79 H-4" marker-end="url(#arrow)"/>
    <text x="560" y="438" text-anchor="middle" class="arch-gatetext">nomad-gate: the Console submits jobs and moves files as the person, never as root</text>
  </g>
</svg>

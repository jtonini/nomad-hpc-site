<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Params.name }}: {{ .Site.Params.tagline }}</title>
    <meta name="description" content="{{ .Site.Params.description }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ .Site.Params.name }}: {{ .Site.Params.tagline }}">
    <meta property="og:description" content="{{ .Site.Params.description }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ "images/og.jpg" | absURL }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#08101a">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" href="/fonts/jost-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <a class="skip" href="#main">Skip to the content</a>
    {{ partial "header.html" . }}
    <main id="main">
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    <script src="/js/site.js" defer></script>
</body>
</html>
